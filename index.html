<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>라쿠너스 인기 클립 박제관 | CHZZK CLIP ARCHIVE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 상단 헤더 -->
  <header class="header">
    <div class="header-inner">
      <div class="brand-area">
        <div class="avatar-wrap">
          <img
            id="channelAvatarImg"
            src="https://nng-phinf.pstatic.net/MjAyNDAzMDFfMjM4/MDAxNzA5Mjc0OTUxNjMx.Sv1OhIE0fHTOSUcqZZJLKPjmmdkX7vQSKDulxdbrleIg.1Za1wI9yLj9dV6tgLLX3DR9BWOawt_Hd5zjaCglFu34g.PNG/FszNyVAaAAAoqgi_%EB%B3%B5%EC%82%AC%EB%B3%B8.png"
            alt="라쿠너스 프로필"
            class="profile-avatar"
          />
          <span id="liveChannelBadge" class="live-dot-badge hidden" title="현재 치지직 생방송 진행 중!">LIVE</span>
        </div>
        <div>
          <div class="title-row">
            <span class="chzzk-badge">CHZZK CLIPS</span>
            <h1>라쿠너스 인기 클립 박제관</h1>
            <span id="followerStatBadge" class="follower-pill">팔로워 491명</span>
          </div>
          <p class="subtitle">
            가끔 그림을 그리거나 주저리하는 라쿤 ·
            <span id="syncStatusText" class="sync-status-inline">📡 실시간 데이터 확인 중...</span>
          </p>
        </div>
      </div>

      <div class="header-actions">
        <div class="summary-stats">
          <div class="stat-item">
            <span>총 박제 클립</span>
            <strong id="totalClipsStat">0개</strong>
          </div>
          <div class="stat-item">
            <span>누적 조회수</span>
            <strong id="totalViewsStat">0회</strong>
          </div>
        </div>
        <button id="syncNowBtn" class="btn-outline sync-btn" title="치지직 서버에서 최신 클립 목록과 실시간 조회수를 불러옵니다">
          🔄 실시간 동기화
        </button>
        <button id="randomClipBtn" class="btn-accent" title="무작위 클립 즉시 재생">🎲 랜덤 고로시 뽑기</button>
        <button id="openAddClipModalBtn" class="btn-outline">+ 새 클립 등록</button>
        <a
          href="https://chzzk.naver.com/a4a172706bed9152f18df8796bde093b"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-outline"
        >치지직 채널 ↗</a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 상단 시어터 플레이어 섹션 -->
    <section class="theater-section" id="theaterSection">
      <div class="player-wrapper">
        <iframe
          id="clipIframe"
          src=""
          title="라쿠너스 치지직 클립 플레이어"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>

      <div class="player-info-panel">
        <div class="now-playing-top">
          <div class="badge-group">
            <span class="rank-badge" id="currentRankBadge">인기 #1</span>
            <span class="cat-badge" id="currentCatBadge">소통/저챗</span>
            <span class="theme-badge" id="currentThemeBadge">🧔 아저씨 시리즈</span>
          </div>
          <h2 id="currentClipTitle" class="now-playing-title">클립을 선택해주세요</h2>
          <div class="now-playing-meta">
            <span>👁️ 조회수 <strong id="currentReadCount">0</strong>회</span>
            <span>•</span>
            <span>⏱️ 길이 <strong id="currentDuration">0초</strong></span>
            <span>•</span>
            <span>📅 <span id="currentDate">-</span></span>
          </div>
        </div>

        <div class="player-controls-card">
          <div class="nav-btn-row">
            <button id="prevClipBtn" class="btn-control">⏮️ 이전 클립</button>
            <button id="nextClipBtn" class="btn-control">다음 클립 ⏭️</button>
          </div>

          <div class="action-btn-col">
            <button id="toggleBookmarkBtn" class="btn-control full-width">⭐ 내 박제함에 찜하기</button>
            <button id="copyShareTextBtn" class="btn-primary full-width">📋 채팅/도네용 링크 복사</button>
            <a
              id="openOriginalClipLink"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-control full-width text-center"
            >🔗 치지직 원본 페이지에서 보기 ↗</a>
          </div>
        </div>

        <!-- TOP 5 빠른 바로가기 -->
        <div class="quick-top5">
          <div class="quick-top5-header">🔥 전설의 고로시 TOP 5 직행열차</div>
          <div class="quick-top5-list" id="quickTop5List"></div>
        </div>
      </div>
    </section>

    <!-- 필터 & 검색 툴바 -->
    <section class="filter-section">
      <div class="theme-tabs" id="themeTabs" role="tablist">
        <button class="theme-tab active" data-theme="ALL">🔥 전체 클립</button>
        <button class="theme-tab" data-theme="TOP30">🏆 명예의 전당 TOP 30</button>
        <button class="theme-tab" data-theme="AJUSSI">🧔 '아저씨' 시리즈</button>
        <button class="theme-tab" data-theme="AEGYO">💖 애교·야레야레·모에</button>
        <button class="theme-tab" data-theme="SCREAM">😱 절규·반찬·급발진</button>
        <button class="theme-tab" data-theme="ART_GAME">🎨 그림 & 🎮 게임</button>
        <button class="theme-tab" data-theme="BOOKMARK">⭐ 내 박제함 <span id="bookmarkCountBadge" class="count-pill">0</span></button>
      </div>

      <div class="toolbar-row">
        <div class="search-box">
          <input
            type="search"
            id="searchInput"
            placeholder="클립 제목 검색 (예: 아저씨, 야레야레, 절규, 너구리, 모에모에, 그랜절...)"
          />
        </div>

        <div class="filter-controls">
          <label class="checkbox-label" title="연령제한(19금) 표시가 붙은 클립 포함 여부">
            <input type="checkbox" id="showAdultToggle" checked />
            <span>🔞 연령제한 클립 포함</span>
          </label>

          <select id="sortSelect" aria-label="정렬 기준">
            <option value="popular">👁️ 인기순 (조회수 높은 순)</option>
            <option value="newest">📅 최신 등록순</option>
            <option value="oldest">🏺 고대 유물순 (오래된 순)</option>
            <option value="shortest">⚡ 짧고 굵은 순 (재생시간 짧은 순)</option>
          </select>
        </div>
      </div>

      <div class="result-status-bar">
        <span>현재 조건에 맞는 클립 <strong id="filteredCountText">0</strong>개</span>
        <span class="hint-text" id="lastSyncTimeHint">💡 카드를 클릭하면 상단 플레이어에서 즉시 재생됩니다.</span>
      </div>
    </section>

    <!-- 클립 카드 그리드 -->
    <section class="clips-grid" id="clipsGrid"></section>

    <!-- 더보기 버튼 -->
    <div class="load-more-wrap">
      <button id="loadMoreBtn" class="btn-load-more hidden">클립 더 불러오기 (+40개)</button>
    </div>
  </main>

  <!-- 새 클립 수동 등록 모달 -->
  <div id="addClipModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>➕ 새로운 라쿠너스 클립 박제하기</h3>
        <button type="button" id="closeAddClipModalBtn" class="close-btn">✕</button>
      </div>
      <form id="addClipForm" class="modal-form">
        <label>
          <span>치지직 클립 주소 또는 클립 UID</span>
          <input
            type="text"
            id="newClipUrlInput"
            placeholder="예: https://chzzk.naver.com/clips/Y9aJrrMCzS 또는 Y9aJrrMCzS"
            required
          />
        </label>
        <label>
          <span>클립 제목</span>
          <input
            type="text"
            id="newClipTitleInput"
            placeholder="예: [라쿠너스] 오늘자 레전드 너구리 비명"
            required
            maxlength="80"
          />
        </label>
        <label>
          <span>재생 시간 (초)</span>
          <input type="number" id="newClipDurationInput" value="30" min="1" max="300" required />
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelAddClipBtn" class="btn-outline">취소</button>
          <button type="submit" class="btn-accent">박제 등록</button>
        </div>
      </form>
    </div>
  </div>

  <script src="clips-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
